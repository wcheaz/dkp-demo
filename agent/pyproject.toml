[project]
name = "agent"
version = "0.1.0"
description = "Truss and roof engineering AI assistant agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn",
    "fastapi",
    "pydantic-ai>=1.61,<2",
    "starlette<1.0.0",
    "logfire>=4.19.0",
    "python-dotenv",
    "httpx",
    "pydantic-ai-skills>=0.10.0",
    "ag-ui-protocol",
    "ezdxf",
    "ifcopenshell>=0.8.5",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = true
